[project]
name = "william-tools"
version = "0.1.0"
description = "Custom MCP tool servers for William (Google Calendar, Gmail) — typed with Pydantic"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Diego Irarrázaval" }]
dependencies = [
    "mcp>=1.2.0,<2",  # 2.x renamed FastMCP
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "google-api-python-client>=2.150",
    "google-auth>=2.37",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.14"]

[project.scripts]
gcal-mcp = "william_tools.gcal_mcp:main"
gmail-mcp = "william_tools.gmail_mcp:main"
william-google-auth = "william_tools.google_auth:cli_authorize"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["william_tools"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
